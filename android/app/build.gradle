def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {
    ndkVersion = "27.0.12077973"

    namespace "com.emmutfg.emmu_tfg"
    compileSdk flutter.compileSdkVersion
    //ndkVersion flutter.ndkVersion

    buildFeatures.buildConfig = true

    defaultConfig {
        applicationId  "com.emmutfg.emmu_tfg"
        minSdkVersion  24
        targetSdkVersion localProperties.getProperty("flutter.targetSdkVersion")?.toInteger() ?: 33
        versionCode    localProperties.getProperty("flutter.versionCode")?.toInteger() ?: 1
        versionName    localProperties.getProperty("flutter.versionName") ?: "1.0"


        Properties properties = new Properties()

        properties.load(project.rootProject.file("local.properties").newDataInputStream())

        buildConfigField "String", "MAPS_API_KEY", "\"${properties.getProperty("MAPS_API_KEY")}\""
        buildConfigField "String", "FIREBASE_OPTIONS_ANDROID_API_KEY", "\"${properties.getProperty("FIREBASE_OPTIONS_ANDROID_API_KEY")}\""
        buildConfigField "String", "FIREBASE_OPTIONS_IOS_API_KEY", "\"${properties.getProperty("FIREBASE_OPTIONS_IOS_API_KEY")}\""
        buildConfigField "String", "SIGN_IN_CALLBACK_API_KEY", "\"${properties.getProperty("SIGN_IN_CALLBACK_API_KEY")}\""
        buildConfigField "String", "DEFAULT_FIREBASE_OPTIONS_API_KEY", "\"${properties.getProperty("DEFAULT_FIREBASE_OPTIONS_API_KEY")}\""
        buildConfigField "String", "TEST_FIREBASE_OPTIONS_ANDROID_API_KEY", "\"${properties.getProperty("TEST_FIREBASE_OPTIONS_ANDROID_API_KEY")}\""
        buildConfigField "String", "TEST_FIREBASE_OPTIONS_IOS_API_KEY", "\"${properties.getProperty("TEST_FIREBASE_OPTIONS_IOS_API_KEY")}\""
        buildConfigField "String", "SECONDARY_FIREBASE_OPTIONS_WEB_API_KEY", "\"${properties.getProperty("SECONDARY_FIREBASE_OPTIONS_WEB_API_KEY")}\""
        buildConfigField "String", "SECONDARY_FIREBASE_OPTIONS_ANDROID_API_KEY", "\"${properties.getProperty("SECONDARY_FIREBASE_OPTIONS_ANDROID_API_KEY")}\""
        buildConfigField "String", "SECONDARY_FIREBASE_OPTIONS_IOS_API_KEY", "\"${properties.getProperty("SECONDARY_FIREBASE_OPTIONS_IOS_API_KEY")}\""

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

//    defaultConfig {
//        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
//        applicationId "com.emmutfg.emmu_tfg"
//        // You can update the following values to match your application needs.
//        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
//        minSdkVersion 24
//        targetSdkVersion flutter.targetSdkVersion
//        versionCode flutterVersionCode.toInteger()
//        versionName flutterVersionName
//   }

    signingConfigs {
        release {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "AndroidDebugKey"
            keyPassword "android"
        }
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "AndroidDebugKey"
            keyPassword "android"
        }
    }


    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
