type User @table {
  displayName: String!
  email: String!
  userType: String!
  createdAt: Timestamp!
  photoUrl: String
  bio: String
  contactPhone: String
}

type MusicianProfile @table {
  user: User!
  primaryInstrument: String!
  experienceLevel: String!
  city: String!
  genres: [String]
  secondaryInstruments: [String]
  hourlyRate: Float
  perGigFee: Float
  availability: String
  bio: String
  audioSamples: [String]
  videoSamples: [String]
}

type Gig @table {
  client: User!
  title: String!
  description: String!
  gigDate: Date!
  location: String!
  budget: Float!
  genrePreference: [String]
  requiredInstruments: [String]
  durationHours: Int
  status: String
}

type Application @table(key: ["musicianProfile", "gig"]) {
  musicianProfile: MusicianProfile!
  gig: Gig!
  status: String!
  appliedAt: Timestamp!
  coverLetter: String
  proposedRate: Float
}

type Booking @table {
  gig: Gig!
  musicianProfile: MusicianProfile!
  bookingDate: Timestamp!
  agreedRate: Float!
  status: String!
  contractDetails: String
}

type Review @table {
  booking: Booking!
  client: User!
  musicianProfile: MusicianProfile!
  rating: Int!
  createdAt: Timestamp!
  comment: String
}